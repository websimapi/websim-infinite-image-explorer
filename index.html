<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Image Explorer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        
        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #f0f0f0;
        }
        
        #scene-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        #scene-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        #magnifying-glass {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #333;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            background-color: rgba(255, 255, 255, 0.1);
            pointer-events: none;
            overflow: hidden;
            z-index: 10;
            transform: translate(-50%, -50%);
            display: none;
        }
        
        #magnified-content {
            position: absolute;
            transform-origin: 0 0;
            pointer-events: none;
        }
        
        #magnifying-handle {
            position: absolute;
            width: 40px;
            height: 120px;
            background-color: #333;
            transform: rotate(45deg);
            bottom: -70px;
            right: -20px;
            border-radius: 10px;
        }
        
        #microscopic-view-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            z-index: 20;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        
        #microscopic-image {
            max-width: 80%;
            max-height: 70%;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        
        #microscopic-description {
            color: white;
            margin-top: 20px;
            max-width: 80%;
            text-align: center;
            font-size: 1.2rem;
        }
        
        #close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
        }
        
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            z-index: 30;
        }
        
        #analysis-popup {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            max-width: 300px;
            z-index: 25;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            display: none;
        }
        
        #close-analysis {
            position: absolute;
            top: 5px;
            right: 5px;
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        #capture-canvas {
            position: absolute;
            top: -9999px;
            left: -9999px;
            pointer-events: none;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 300px;
            z-index: 15;
        }
        
        #error-message {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background-color: rgba(255, 50, 50, 0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 300px;
            z-index: 25;
            display: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="scene-container">
            <img id="scene-image" alt="Generated scene" crossorigin="anonymous">
        </div>
        
        <div id="magnifying-glass">
            <div id="magnified-content"></div>
            <div id="magnifying-handle"></div>
        </div>
        
        <div id="microscopic-view-container">
            <img id="microscopic-image" alt="Microscopic view">
            <p id="microscopic-description"></p>
            <button id="close-button">×</button>
        </div>
        
        <div id="analysis-popup">
            <button id="close-analysis">×</button>
            <p id="analysis-text"></p>
        </div>
        
        <div id="loading">
            <div class="spinner"></div>
            <span id="loading-text">Generating scene...</span>
        </div>
        
        <div id="instructions">
            Left-click to analyze what you're looking at. Right-click to see a microscopic view.
        </div>
        
        <div id="error-message"></div>
        
        <canvas id="capture-canvas"></canvas>
    </div>
    
    <script>
        // Elements
        const sceneImage = document.getElementById('scene-image');
        const magnifyingGlass = document.getElementById('magnifying-glass');
        const magnifiedContent = document.getElementById('magnified-content');
        const microscopicViewContainer = document.getElementById('microscopic-view-container');
        const microscopicImage = document.getElementById('microscopic-image');
        const microscopicDescription = document.getElementById('microscopic-description');
        const closeButton = document.getElementById('close-button');
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loading-text');
        const analysisPopup = document.getElementById('analysis-popup');
        const analysisText = document.getElementById('analysis-text');
        const closeAnalysis = document.getElementById('close-analysis');
        const captureCanvas = document.getElementById('capture-canvas');
        const ctx = captureCanvas.getContext('2d');
        const errorMessage = document.getElementById('error-message');
        
        // State
        let currentScene = '';
        let zoomScale = 2;
        let isGenerating = false;
        let conversationHistory = [];
        let currentMouseX = 0;
        let currentMouseY = 0;
        let originalImageUrl = '';
        
        // CORS proxies to try
        const corsProxies = [
            '', // Try direct access first
            'https://cors-anywhere.herokuapp.com/',
            'https://api.allorigins.win/raw?url=',
            'https://corsproxy.io/?'
        ];
        
        // Initialize the app
        window.addEventListener('DOMContentLoaded', async () => {
            await generateInitialScene();
            setupMagnifyingGlass();
            setupCloseButton();
            setupAnalysisPopup();
        });
        
        // Generate initial scene
        async function generateInitialScene() {
            try {
                // Generate scene description
                const completion = await websim.chat.completions.create({
                    messages: [
                        {
                            role: "system",
                            content: "You are a detailed scene creator. Generate a richly detailed description of a scene with many interesting objects. Make it detailed enough for image generation."
                        },
                        {
                            role: "user",
                            content: "Create a detailed scene description for an image generation prompt. Include various objects, textures, and elements that would be interesting to examine closely. Make it intricate and vibrant."
                        }
                    ]
                });
                
                currentScene = completion.content;
                conversationHistory = [
                    {
                        role: "system",
                        content: "You are a detailed scene creator and microscopic explorer."
                    },
                    {
                        role: "assistant",
                        content: "I've created this scene: " + currentScene
                    }
                ];
                
                // Generate image from description
                loadingText.textContent = "Generating image from description...";
                const result = await websim.imageGen({
                    prompt: currentScene,
                    aspect_ratio: "16:9"
                });
                
                originalImageUrl = result.url;
                
                // Try to load the image with CORS enabled
                await loadImageWithCORSProxy(result.url);
                
            } catch (error) {
                console.error("Error generating scene:", error);
                loadingText.textContent = "Error: " + error.message;
                showError("Failed to generate initial scene: " + error.message);
            }
        }
        
        // Load image with CORS proxy with fallback
        async function loadImageWithCORSProxy(url) {
            let loadSuccess = false;
            let lastError = null;
            
            // Try each proxy in sequence
            for (let i = 0; i < corsProxies.length; i++) {
                try {
                    const proxyUrl = corsProxies[i] + url;
                    loadingText.textContent = `Trying to load image (method ${i+1}/${corsProxies.length})...`;
                    
                    // Create a promise to track image loading
                    await new Promise((resolve, reject) => {
                        sceneImage.onload = () => {
                            loadSuccess = true;
                            resolve();
                        };
                        sceneImage.onerror = (err) => {
                            reject(new Error(`Failed to load with proxy ${i+1}`));
                        };
                        
                        // Set crossorigin attribute and src
                        sceneImage.crossOrigin = "anonymous";
                        sceneImage.src = proxyUrl;
                    });
                    
                    // If we get here, loading succeeded
                    console.log(`Successfully loaded image with proxy method ${i+1}`);
                    loading.style.display = "none";
                    magnifyingGlass.style.display = "block";
                    return;
                    
                } catch (error) {
                    console.error(`Error with proxy ${i+1}:`, error);
                    lastError = error;
                    // Continue to next proxy
                }
            }
            
            // If all proxies failed, use descriptive analysis instead
            if (!loadSuccess) {
                loading.style.display = "none";
                magnifyingGlass.style.display = "block";
                
                // Regular loading for visual display only
                sceneImage.crossOrigin = "anonymous";
                sceneImage.src = url;
                
                showError("CORS restrictions detected. Using AI-only analysis mode.");
                console.warn("All CORS proxies failed. Using AI-only analysis mode:", lastError);
            }
        }
        
        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = "block";
            setTimeout(() => {
                errorMessage.style.display = "none";
            }, 5000);
        }
        
        // Setup the magnifying glass functionality
        function setupMagnifyingGlass() {
            document.addEventListener('mousemove', (e) => {
                if (isGenerating) return;
                
                currentMouseX = e.clientX;
                currentMouseY = e.clientY;
                
                // Position the magnifying glass
                magnifyingGlass.style.left = `${currentMouseX}px`;
                magnifyingGlass.style.top = `${currentMouseY}px`;
                
                // Create magnified content
                updateMagnifiedContent(currentMouseX, currentMouseY);
            });
            
            // Handle different click actions
            document.addEventListener('click', async (e) => {
                if (isGenerating || microscopicViewContainer.style.display === 'flex') return;
                
                // Left click - analyze only
                await analyzeCurrentView(currentMouseX, currentMouseY);
            });
            
            document.addEventListener('contextmenu', async (e) => {
                e.preventDefault(); // Prevent context menu
                
                if (isGenerating || microscopicViewContainer.style.display === 'flex') return;
                
                // Right click - analyze and show microscopic view
                await analyzeAndGenerateMicroscopicView(currentMouseX, currentMouseY);
            });
        }
        
        // Update the content inside the magnifying glass
        function updateMagnifiedContent(x, y) {
            const glassDiameter = magnifyingGlass.offsetWidth;
            const glassRadius = glassDiameter / 2;
            
            // Clone the scene image for the magnified view
            magnifiedContent.style.width = `${sceneImage.offsetWidth * zoomScale}px`;
            magnifiedContent.style.height = `${sceneImage.offsetHeight * zoomScale}px`;
            
            // Position the cloned content to show the right area
            const posX = -x * zoomScale + glassRadius;
            const posY = -y * zoomScale + glassRadius;
            magnifiedContent.style.backgroundImage = `url(${sceneImage.src})`;
            magnifiedContent.style.backgroundSize = `${sceneImage.offsetWidth * zoomScale}px ${sceneImage.offsetHeight * zoomScale}px`;
            magnifiedContent.style.backgroundPosition = `${posX}px ${posY}px`;
        }
        
        // Get descriptive location of where user is looking
        function getPositionDescription(x, y) {
            // Calculate relative position in the image (as percentages)
            const relativeX = (x / window.innerWidth * 100).toFixed(1);
            const relativeY = (y / window.innerHeight * 100).toFixed(1);
            
            // Create descriptive location
            return {
                relativeX,
                relativeY,
                description: `approximately ${relativeX}% from the left and ${relativeY}% from the top of the image`
            };
        }
        
        // Try to capture the magnified area with multiple methods
        async function safeCaptureMagnifiedArea() {
            const position = getPositionDescription(currentMouseX, currentMouseY);
            
            try {
                // Method 1: Try canvas capture if CORS allows
                const glassDiameter = magnifyingGlass.offsetWidth;
                
                // Set canvas size to match the magnifying glass
                captureCanvas.width = glassDiameter;
                captureCanvas.height = glassDiameter;
                
                // Clear previous content
                ctx.clearRect(0, 0, glassDiameter, glassDiameter);
                
                // Create a circular clipping path
                ctx.beginPath();
                ctx.arc(glassDiameter/2, glassDiameter/2, glassDiameter/2, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
                
                // Calculate source position and dimensions
                const sourceX = currentMouseX - glassDiameter/2/zoomScale;
                const sourceY = currentMouseY - glassDiameter/2/zoomScale;
                const sourceWidth = glassDiameter/zoomScale;
                const sourceHeight = glassDiameter/zoomScale;
                
                // Draw the image portion
                ctx.drawImage(
                    sceneImage,
                    Math.max(0, sourceX), Math.max(0, sourceY),
                    Math.min(sourceWidth, sceneImage.width - sourceX), 
                    Math.min(sourceHeight, sceneImage.height - sourceY),
                    0, 0, glassDiameter, glassDiameter
                );
                
                // Try to get data URL - this may fail due to CORS
                const dataUrl = captureCanvas.toDataURL('image/png');
                return { 
                    success: true, 
                    dataUrl,
                    position
                };
            }
            catch (error) {
                console.warn("Canvas capture failed:", error);
                
                // Method 2: Fall back to position-based description only
                return { 
                    success: false, 
                    position, 
                    error
                };
            }
        }
        
        // Analyze current view without showing microscopic image (left click)
        async function analyzeCurrentView(x, y) {
            isGenerating = true;
            loading.style.display = "flex";
            loadingText.textContent = "Analyzing...";
            
            try {
                // Try to capture the magnified area
                const captureResult = await safeCaptureMagnifiedArea();
                const position = captureResult.position;
                
                // Prepare message content array
                let messageContent = [
                    {
                        type: "text",
                        text: `I'm examining a part of the scene at ${position.description}. Based on the overall scene description (${currentScene}) and this position, what object am I likely looking at in this magnified view? Provide a brief analysis of what you might see here.`
                    }
                ];
                
                // Add image if capture was successful
                if (captureResult.success) {
                    messageContent.push({
                        type: "image_url",
                        image_url: { url: captureResult.dataUrl }
                    });
                }
                
                // Analyze the image at position with LLM
                const analyzeCompletion = await websim.chat.completions.create({
                    messages: [
                        ...conversationHistory,
                        {
                            role: "user",
                            content: messageContent
                        }
                    ]
                });
                
                const analysis = analyzeCompletion.content;
                conversationHistory.push({
                    role: "user",
                    content: `Analyze the object at position ${position.relativeX}%, ${position.relativeY}% of the scene.`
                });
                conversationHistory.push({
                    role: "assistant",
                    content: analysis
                });
                
                // Show analysis popup
                analysisText.textContent = analysis;
                analysisPopup.style.display = "block";
                analysisPopup.style.left = `${x + 20}px`;
                analysisPopup.style.top = `${y - 20}px`;
                
                loading.style.display = "none";
                isGenerating = false;
                
            } catch (error) {
                console.error("Error analyzing view:", error);
                loadingText.textContent = "Error: " + error.message;
                isGenerating = false;
                showError("Analysis failed: " + error.message);
                setTimeout(() => {
                    loading.style.display = "none";
                }, 2000);
            }
        }
        
        // Analyze and generate microscopic view
        async function analyzeAndGenerateMicroscopicView(x, y) {
            isGenerating = true;
            loading.style.display = "flex";
            loadingText.textContent = "Analyzing...";
            
            try {
                // Try to capture the magnified area
                const captureResult = await safeCaptureMagnifiedArea();
                const position = captureResult.position;
                
                // Prepare message content array
                let messageContent = [
                    {
                        type: "text",
                        text: `I'm examining a part of the scene at ${position.description}. Based on the overall scene description (${currentScene}) and this position, what object am I likely looking at? Describe what this would look like under a microscope with extreme magnification. Be detailed about textures, structures, cells, or microscopic elements that might be present.`
                    }
                ];
                
                // Add image if capture was successful
                if (captureResult.success) {
                    messageContent.push({
                        type: "image_url",
                        image_url: { url: captureResult.dataUrl }
                    });
                }
                
                // Analyze the image with LLM
                loadingText.textContent = "Analyzing object...";
                const analyzeCompletion = await websim.chat.completions.create({
                    messages: [
                        ...conversationHistory,
                        {
                            role: "user",
                            content: messageContent
                        }
                    ]
                });
                
                const analysis = analyzeCompletion.content;
                conversationHistory.push({
                    role: "user",
                    content: `Analyze the object at position ${position.relativeX}%, ${position.relativeY}% of the scene microscopically.`
                });
                conversationHistory.push({
                    role: "assistant",
                    content: analysis
                });
                
                // Generate microscopic view based on analysis
                loadingText.textContent = "Generating microscopic view...";
                const microscopicResult = await websim.imageGen({
                    prompt: `Microscopic extreme close-up view of ${analysis}. Scientific, detailed, high magnification.`,
                    aspect_ratio: "1:1"
                });
                
                // Display the microscopic view
                microscopicImage.onload = () => {
                    loading.style.display = "none";
                    microscopicViewContainer.style.display = "flex";
                    isGenerating = false;
                };
                microscopicImage.src = microscopicResult.url;
                microscopicDescription.textContent = analysis;
                
            } catch (error) {
                console.error("Error analyzing and generating microscopic view:", error);
                loadingText.textContent = "Error: " + error.message;
                isGenerating = false;
                showError("Microscopic view generation failed: " + error.message);
                setTimeout(() => {
                    loading.style.display = "none";
                }, 2000);
            }
        }
        
        // Setup close button for microscopic view
        function setupCloseButton() {
            closeButton.addEventListener('click', () => {
                microscopicViewContainer.style.display = "none";
            });
        }
        
        // Setup analysis popup close button
        function setupAnalysisPopup() {
            closeAnalysis.addEventListener('click', () => {
                analysisPopup.style.display = "none";
            });
        }
    </script>
